<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Expenses</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation bar: floating glass buttons over a soft scroll-edge blur; the inline title appears once the large title scrolls away. -->
  <header class="navbar" id="navbar">
    <div class="nav-side">
      <button class="glass-btn glass" id="backBtn" aria-label="Back to Dashboard" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
    <div class="nav-title" id="navTitle" aria-hidden="true"></div>
    <div class="nav-side end">
      <button class="glass-btn glass" id="hideBtn" aria-label="Hide amounts" aria-pressed="false"></button>
      <button class="glass-btn glass" id="menuBtn" aria-label="Export and backup" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="filled"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="page-head">
      <h1 class="large-title" id="title">Expenses</h1>
      <div class="period" id="period">
        <button class="period-btn" id="prevMonth" aria-label="Previous month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="period-label" id="monthLabel" aria-label="Jump to this month"></button>
        <button class="period-btn" id="nextMonth" aria-label="Next month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
    <section class="view" id="view-list"></section>
    <section class="view" id="view-dash" hidden></section>
    <section class="view" id="view-detail" hidden></section>
  </main>

  <!-- Tab bar navigates; the add button is a separate action, as the HIG asks. -->
  <div class="bottom-bar">
    <nav class="tabbar glass" aria-label="Sections">
      <button class="tab" data-tab="list" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/><circle class="dot" cx="5" cy="6.5" r="1.6"/><circle class="dot" cx="5" cy="12" r="1.6"/><circle class="dot" cx="5" cy="17.5" r="1.6"/></svg>
        <span>Expenses</span>
      </button>
      <button class="tab" data-tab="dash">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="filled"><rect x="3.5" y="11" width="4.5" height="9.5" rx="1.6"/><rect x="9.75" y="3.5" width="4.5" height="17" rx="1.6"/><rect x="16" y="7.5" width="4.5" height="13" rx="1.6"/></svg>
        <span>Dashboard</span>
      </button>
    </nav>
    <button class="fab" id="addBtn" aria-label="Add expense">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
    <form id="sheetForm" novalidate>
      <div class="sheet-bar">
        <button type="button" class="glass-btn glass" id="cancelBtn" aria-label="Cancel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
        </button>
        <h2 id="sheetTitle">New Expense</h2>
        <button type="submit" class="glass-btn tinted" id="saveBtn" aria-label="Save">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <label class="amount-wrap" id="amountWrap">
          <span class="currency" id="currency">$</span>
          <input id="amount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" enterkeyhint="done" aria-label="Amount in SGD">
        </label>
        <p class="field-error" id="amountError" hidden>Enter an amount</p>
        <div class="seg sign-seg" id="signSeg" role="group" aria-label="Spent or received">
          <button type="button" data-sign="1" aria-pressed="true">Spent</button>
          <button type="button" data-sign="-1" aria-pressed="false">Received</button>
        </div>

        <h3 class="group-head">Category</h3>
        <div class="cats card" id="chips" role="radiogroup" aria-label="Category"></div>
        <p class="field-error" id="categoryError" hidden>Pick a category</p>

        <div class="card form-group">
          <label class="form-row">
            <span class="form-label">Date</span>
            <input id="date" type="date" required>
          </label>
          <label class="form-row">
            <input id="note" type="text" placeholder="Description" maxlength="200" enterkeyhint="done" autocomplete="off">
          </label>
        </div>

        <div class="card form-group">
          <label class="form-row photo-add" id="photoAdd">
            <input id="photoInput" type="file" accept="image/*" class="visually-hidden">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5a2 2 0 0 1 2-2h2l1.6-2.2h5.8l1.6 2.2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></svg>
            <span>Add Receipt Photo</span>
          </label>
          <div class="form-row photo-preview" id="photoPreview" hidden>
            <button type="button" class="thumb-btn" id="thumbBtn" aria-label="View receipt photo"><img id="photoThumb" alt="Receipt"></button>
            <span class="grow">Receipt Photo</span>
            <button type="button" class="text-btn danger" id="photoRemove">Remove</button>
          </div>
        </div>

        <button type="button" class="card delete-btn" id="deleteBtn" hidden>Delete Expense</button>
      </div>
    </form>
  </dialog>

  <dialog id="menu" class="menu glass" aria-label="Export and backup">
    <div class="menu-body" id="menuBody" role="menu"></div>
    <input type="file" id="restoreInput" accept=".zip,application/zip" class="visually-hidden">
  </dialog>

  <dialog id="viewer" aria-label="Receipt photo">
    <img id="viewerImg" alt="Receipt">
    <button type="button" class="glass-btn glass viewer-close" id="viewerClose" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
  </dialog>

  <div id="toast" class="toast glass" role="status" aria-live="polite"></div>

  <script src="zip.js"></script>
  <script src="xlsx.js"></script>
  <script src="app.js"></script>
</body>
</html>
